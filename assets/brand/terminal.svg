<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-labelledby="t d"><title id="t">Andarz quick start</title><desc id="d">A terminal session: clone, run the tests, start the local web UI on 127.0.0.1:8765.</desc><style>.m{font-family:Consolas,'DejaVu Sans Mono',monospace;font-size:15px}.l{animation:show .01s linear both}.l1{animation-delay:0.4s}.l2{animation-delay:1.2s}.l3{animation-delay:2.0s}.l4{animation-delay:2.8s}.l5{animation-delay:3.6s}.l6{animation-delay:4.4s}.l7{animation-delay:5.2s}.l8{animation-delay:6.0s}.cur{animation:blink 1s steps(1) infinite}@keyframes show{from{opacity:0}to{opacity:1}}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.l,.cur{animation:none}}</style><rect width="860" height="300" rx="14" fill="#09251C"/><rect width="860" height="36" rx="14" fill="#123A2C"/><rect y="22" width="860" height="14" fill="#123A2C"/><circle cx="22" cy="18" r="6" fill="#A55704"/><circle cx="42" cy="18" r="6" fill="#F3D2AF"/><circle cx="62" cy="18" r="6" fill="#F8EADC"/><text x="430" y="23" text-anchor="middle" class="m" font-size="13" fill="#F3D2AF">cmd — Andarz</text><g class="m"><text x="22" y="70" class="l l1" fill="#F8EADC"><tspan fill="#F3D2AF">C:\&gt;</tspan> git clone https://github.com/MobitSolidity/marfin-llm.git</text><text x="22" y="96" class="l l2" fill="#F8EADC"><tspan fill="#F3D2AF">C:\&gt;</tspan> cd marfin-llm</text><text x="22" y="122" class="l l3" fill="#F8EADC"><tspan fill="#F3D2AF">C:\marfin-llm&gt;</tspan> bash tests/run_all.sh</text><text x="22" y="148" class="l l4" fill="#F3D2AF">  ... no model and no network needed</text><text x="22" y="174" class="l l5" fill="#7FC8A0">  ALL GREEN</text><text x="22" y="200" class="l l6" fill="#F8EADC"><tspan fill="#F3D2AF">C:\marfin-llm&gt;</tspan> python scripts\ui.py --model C:\models\Qwen3.5-4B-Q4_K_M.gguf</text><text x="22" y="226" class="l l7" fill="#E7A35C">  Andarz UI: http://127.0.0.1:8765/   (Ctrl+C to stop)</text><text x="22" y="252" class="l l8" fill="#F8EADC"><tspan fill="#F3D2AF">C:\marfin-llm&gt;</tspan><tspan class="cur" fill="#F3D2AF"> ▌</tspan></text></g></svg>
